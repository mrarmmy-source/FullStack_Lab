<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="lab01.css">
</head>
<body>
    <h1>Registration Form!!</h1>
    <form method="post" action="/submit">
        <table>
            <tr>
                <td><label for="name">Enter your name:</label></td>
                <td><input type="text" id="name" name="name" placeholder="Enter your name"></td>
            </tr>
            <tr>
                <td><label for="age">Enter your age:</label></td>
                <td><input type="text" id="age" name="age" placeholder="Enter your age"></td>
            </tr>
            <tr>
                <td><label for="gender">Enter your gender:</label></td>
                <td>
                    <input type="radio" id="male" name="gender" value="Male"> Male
                    <input type="radio" id="female" name="gender" value="Female"> Female
                </td>
            </tr>
            <tr>
                <td><label for="country">Enter your address country:</label></td>
                <td>
                    <select id="country" name="country">
                        <option value="India">India</option>
                        <option value="USA">USA</option>
                        <option value="UK">UK</option>
                        <!-- Add more countries as needed -->
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="address">Enter your address:</label></td>
                <td><textarea id="address" name="address" placeholder="Enter your address"></textarea></td>
            </tr>
            <tr>
                <td><label for="maritalStatus">Are you married?</label></td>
                <td><input type="checkbox" id="maritalStatus" name="maritalStatus"> Yes</td>
            </tr>
        </table>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
